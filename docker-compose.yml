services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: politicando
      POSTGRES_PASSWORD: politicando
      POSTGRES_DB: politicando
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politicando"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
