# Render Blueprint: the API, its scheduled jobs and the database, all built from the Dockerfile.
# Render › New › Blueprint, pick this repo. Values marked `sync: false` are asked for on the first
# deploy only; change them later in each service's Environment page. Schedules are in UTC.
# See "Deploy on Render" in the README.

databases:
  - name: politicando-db
    databaseName: politicando
    user: politicando
    region: frankfurt
    postgresMajorVersion: "17"
    plan: basic-1gb
    # About 1.1 GB today, nearly all public contracts, which grow every week.
    diskSizeGB: 5

services:
  - type: web
    name: politicando-api
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    # Migrates, then seeds (parties, local officials): one script, so a hand-edited command still seeds.
    preDeployCommand: node dist/db/migrate.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politicando-db, property: connectionString }
      # Tells the website to refresh its cached pages after a change (src/revalidate.ts, docs/revalidate.md).
      # e.g. https://www.politicando.pt/api/revalidate, and the same secret as the frontend's REVALIDATE_SECRET
      # (`openssl rand -hex 32`). Leave both empty to turn the pings off.
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # Render passes on a client-sent X-Forwarded-For; Cloudflare's True-Client-IP can't be forged.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # The same secret as the frontend service's FRONTEND_API_KEY (server-only, not NEXT_PUBLIC_).
      # Generate it once, e.g. `openssl rand -hex 32`, and set it on both services.
      - key: FRONTEND_API_KEY
        sync: false
      # The frontends, comma-separated, e.g. https://politicando.pt,https://www.politicando.pt
      - key: CORS_ORIGINS
        sync: false
      - key: RECAPTCHA_SECRET
        sync: false
      # Keys for POST /api/v2/publish (blog posts by API, docs/publish-api.md), comma-separated. Empty: off.
      - key: PUBLISH_API_KEYS
        sync: false
      # e.g. politicando.pt,www.politicando.pt
      - key: RECAPTCHA_HOSTNAMES
        sync: false
      # Generated once and kept: changing them changes every poster ID / breaks sent newsletter links.
      - key: FORUM_SECRET
        generateValue: true
      - key: NEWSLETTER_SECRET
        generateValue: true
      # smtps://user:password@host:465 from the mail provider; leave empty to keep the newsletter off.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: Politicando <info@politicando.pt>
      - key: SITE_URL
        sync: false
      # This API's public address, e.g. https://api.politicando.pt
      - key: PUBLIC_API_URL
        sync: false

  # RSS feeds only cover a few hours: run it every hour.
  - type: cron
    name: politicando-ingest
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "5 * * * *"
    dockerCommand: node dist/jobs/ingest.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politicando-db, property: connectionString }
      # Tells the website to refresh its cached pages after a change (src/revalidate.ts, docs/revalidate.md).
      # e.g. https://www.politicando.pt/api/revalidate, and the same secret as the frontend's REVALIDATE_SECRET
      # (`openssl rand -hex 32`). Leave both empty to turn the pings off.
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # IndexNow (Bing and others): the same key the frontend serves at /<key>.txt (public by design).
      - key: INDEXNOW_KEY
        value: 5b5bc5c4-6bd8-482f-97b8-3fabbef46451
      - key: SITE_URL
        value: https://www.politicando.pt
      # Claude Haiku confirms which stories are the same news before they're joined (src/stories/merge.ts).
      # A key from console.anthropic.com; costs well under $1 a month. Empty: stories are never joined.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: cron
    name: politicando-parliament-sync
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "0 4 * * *"
    dockerCommand: node dist/jobs/syncParliament.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politicando-db, property: connectionString }
      # Tells the website to refresh its cached pages after a change (src/revalidate.ts, docs/revalidate.md).
      # e.g. https://www.politicando.pt/api/revalidate, and the same secret as the frontend's REVALIDATE_SECRET
      # (`openssl rand -hex 32`). Leave both empty to turn the pings off.
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # Change when a new legislature starts (see src/parliament/legislatures.ts).
      - key: PARLIAMENT_LEGISLATURE
        value: XVII

  # The State Budget's amendment proposals and each party's votes (docs/budget-api.md). Hourly: during
  # the voting weeks the parliament updates its file the same day; an unchanged file is skipped.
  - type: cron
    name: politicando-budget
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "35 * * * *"
    dockerCommand: node dist/jobs/syncBudget.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politicando-db, property: connectionString }
      # Proposals' summaries ("O que muda"), news and statements (src/budget/enrich.ts); without it they're skipped.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # Change when a new legislature starts (see src/parliament/legislatures.ts).
      - key: PARLIAMENT_LEGISLATURE
        value: XVII

  # The Government and the President.
  - type: cron
    name: politicando-government-sync
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "30 4 * * *"
    dockerCommand: node dist/jobs/syncGovernment.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politicando-db, property: connectionString }
      # Tells the website to refresh its cached pages after a change (src/revalidate.ts, docs/revalidate.md).
      # e.g. https://www.politicando.pt/api/revalidate, and the same secret as the frontend's REVALIDATE_SECRET
      # (`openssl rand -hex 32`). Leave both empty to turn the pings off.
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false

  # The political calendar: parliament, President, European Parliament. Every 3 hours,
  # since the parliament's and the President's agendas change during the day.
  - type: cron
    name: politicando-agenda
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "20 */3 * * *"
    dockerCommand: node dist/jobs/syncAgenda.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politicando-db, property: connectionString }
      # Tells the website to refresh its cached pages after a change (src/revalidate.ts, docs/revalidate.md).
      # e.g. https://www.politicando.pt/api/revalidate, and the same secret as the frontend's REVALIDATE_SECRET
      # (`openssl rand -hex 32`). Leave both empty to turn the pings off.
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: PARLIAMENT_LEGISLATURE
        value: XVII

  # BASE regenerates its yearly files weekly.
  - type: cron
    name: politicando-contracts
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "0 5 * * 1"
    dockerCommand: node dist/jobs/importContracts.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politicando-db, property: connectionString }
